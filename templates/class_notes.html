{% extends "base.html" %}

{% block title %}Class Notes{% endblock %}

{% block content %}

<style>

.notes-page {
    padding: 35px 10px 70px;
}

/* Header */

.notes-header {
    background: linear-gradient(135deg, #092f78, #167bdc, #35a9e8);
    color: white;
    border-radius: 24px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 10px 28px rgba(0,80,180,.22);
}

.notes-header h1 {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 8px;
}

.notes-header p {
    margin: 0;
    opacity: .9;
}


/* Subject Box */

.subject-box {
    background: white;
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 7px 22px rgba(0,0,0,.08);
    border: 1px solid #edf0f5;
    margin-bottom: 30px;
}

.subject-box label {
    font-weight: 800;
    color: #263b5e;
    margin-bottom: 8px;
}

.subject-box select {
    border-radius: 12px;
    padding: 12px;
    border: 1px solid #dce3ed;
}


/* Notes Card */

.note-card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    height: 100%;
    border: 1px solid #e7edf5;
    box-shadow: 0 7px 22px rgba(0,0,0,.08);
    transition: .3s;
}

.note-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 13px 28px rgba(0,0,0,.12);
}

.note-icon {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    background: #e4f0ff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
    margin-bottom: 15px;
}

.note-card h3 {
    font-size: 19px;
    font-weight: 900;
    color: #172b4d;
}

.note-card p {
    color: #747d8d;
    font-size: 13px;
}

.view-note-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 9px 17px;
    border-radius: 10px;

    background: linear-gradient(135deg, #092f78, #167bdc);

    color: white !important;
    text-decoration: none !important;

    font-size: 13px;
    font-weight: 800;
}

.view-note-btn:hover {
    color: white !important;
    transform: translateY(-2px);
}


/* Back */

.back-btn {
    display: inline-block;
    margin-top: 35px;
    padding: 11px 23px;

    border-radius: 12px;
    background: white;
    border: 1px solid #dce4ef;

    color: #173d82;
    text-decoration: none;
    font-weight: 800;
}

.back-btn:hover {
    background: #eef6ff;
    color: #1674df;
}

</style>


<div class="container notes-page">


    <!-- HEADER -->

    <div class="notes-header">

        <h1>
            📒 Class Notes
        </h1>

        <p>
            Select an exam and subject to access
            class notes and study material.
        </p>

    </div>


    <!-- EXAM -->

    <div class="subject-box">

        <label>
            🎓 Select Exam
        </label>

        <select
            class="form-select"
            id="examSelect"
            onchange="showSubjects()"
        >

            <option value="">
                Select Exam
            </option>

            <option value="JEE">
                JEE
            </option>

            <option value="NEET">
                NEET
            </option>

            <option value="MHT-CET">
                MHT-CET
            </option>

        </select>

    </div>


    <!-- SUBJECT -->

    <div
        class="subject-box"
        id="subjectBox"
        style="display:none;"
    >

        <label>
            📚 Select Subject
        </label>

        <select
            class="form-select"
            id="subjectSelect"
            onchange="showNotes()"
        >

            <option value="">
                Select Subject
            </option>

        </select>

    </div>


    <!-- NOTES -->

    <div
        class="row g-4"
        id="notesContainer"
    >

        <div class="col-12">

            <div class="text-center text-muted">

                📖 Select an exam and subject to view notes.
</div>

        </div>

    </div>


    <!-- BACK -->

    <div class="text-center">

        <a
            href="{{ url_for('learning_hub') }}"
            class="back-btn"
        >
            ← Back 
        </a>

    </div>


</div>


<script>

/* =========================
   SUBJECT SELECTION
========================= */

function showSubjects() {

    const exam =
        document.getElementById("examSelect").value;

    const subjectBox =
        document.getElementById("subjectBox");

    const subjectSelect =
        document.getElementById("subjectSelect");

    const container =
        document.getElementById("notesContainer");


    subjectSelect.innerHTML = `
        <option value="">
            Select Subject
        </option>
    `;

    container.innerHTML = `
        <div class="col-12">
            <div class="text-center text-muted">
                📖 Select a subject to view notes.
            </div>
        </div>
    `;


    if (exam === "") {

        subjectBox.style.display = "none";

        return;
    }


    subjectBox.style.display = "block";


    if (exam === "JEE") {

        subjectSelect.innerHTML += `

            <option value="Mathematics">
                📐 Mathematics
            </option>

            <option value="Physics">
                ⚡ Physics
            </option>

            <option value="Chemistry">
                🧪 Chemistry
            </option>

    }


    else if (exam === "NEET") {

        subjectSelect.innerHTML += `

            <option value="Physics">
                ⚡ Physics

            </option>

        `;

    }

}

{% endblock %}
