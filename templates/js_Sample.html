<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Sample</title>
        <link href="https://www.google.com/search?q=bootstrap&oq=bootstra&gs_lcrp=EgZjaHJvbWUqDQgBEAAYgwEYsQMYgAQyBggAEEUYOTINCAEQABiDARixAxiABDINCAIQABiDARixAxiABDIMCAMQABgUGIcCGIAEMgoIBBAAGLEDGIAEMgoIBRAAGLEDGIAEMgYIBhBFGDwyBggHEAUYQNIBCDUzOTVqMGo3qAIIsAIB8QXOgJ_5XL7djw&sourceid=chrome&ie=UTF-8" rel="stylesheet">>
    </head>
    <body class="'bg-light">
        <div class="Container mt-4"></div>
        <h2 clss="'fw-bold mb-4">Student live search demo</h2>
        <input type=""text" id="searchInput" class="form-control mb-3"
        placeholder="Type to search...">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Roll no</th>
                    <th>marks</th>
                    <th>Subject</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                {% for student in students %}
                    <tr>
                        <td>{{ student.name }}</td>
                        <td>{{ student.roll_no }}</td>
                        <td>{{ student.marks }}</td>
                        <td>{{ student.subject }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

    </body>

</html>
