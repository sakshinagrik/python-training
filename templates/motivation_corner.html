{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <!-- Header -->

    <div class="card shadow-lg border-0 text-center mb-4"
         style="border-radius:20px;background:linear-gradient(135deg,#eef7ff,#ffffff);">

        <div class="card-body p-4">

            <h1 class="fw-bold text-primary">

                🤖 AI Motivation Corner

            </h1>

            <p class="text-secondary">

                Stay Positive • Stay Focused • Stay Strong

            </p>

        </div>

    </div>

    <!-- Today's Good Thought -->

    <div class="card shadow border-0 mb-4"
         style="border-radius:18px;">

        <div class="card-header bg-primary text-white text-center">

            <h3 class="mb-0">

                🌞 TODAY'S GOOD THOUGHT

            </h3>

        </div>

        <div class="card-body text-center p-4">

            <h5 id="todayThought"></h5>

        </div>

    </div>

    <!-- Mood -->

    <div class="card shadow border-0"
         style="border-radius:18px;">

        <div class="card-body">

            <h3 class="text-center">

                😊 Choose Your Mood

            </h3>

            <p class="text-center text-muted">

                Tell AI how you are feeling today.

            </p>

            <div class="mt-4">

                <select
                id="mood"
                class="form-select form-select-lg">

                    <option value="">Select Your Mood</option>

                    <option value="stress">😰 Exam Stress</option>

                    <option value="demotivated">😔 Feeling Demotivated</option>

                    <option value="lazy">😴 Feeling Lazy</option>

                    <option value="confidence">😟 Low Confidence</option>

                    <option value="fear">😨 Fear Of Failure</option>

                    <option value="sad">😢 Feeling Sad</option>

                    <option value="happy">😊 Feeling Happy</option>

                </select>

            </div>

            <div class="d-flex justify-content-center gap-3 mt-5">

                <button
                class="btn btn-outline-dark px-4"
                onclick="history.back()">

                    ⬅️ Back

                </button>

                <button
                class="btn btn-warning px-4"
                onclick="generateMotivation()">

                    🤖 Motivate Me

                </button>

            </div>

        </div>

    </div>

    <div id="result" class="mt-4"></div>

</div>

<script>

const thoughts = [

"🌸 Sunday : Rest today and prepare for tomorrow.",

"🌸 Monday : Every new week is a new opportunity.",

"🌸 Tuesday : Small daily efforts create big success.",

"🌸 Wednesday : Believe in yourself. You are stronger than you think.",

"🌸 Thursday : Don't stop until you are proud.",

"🌸 Friday : Success comes from consistency.",

"🌸 Saturday : Learn something new today."

];




let day=new Date().getDay();

document.getElementById("todayThought").innerHTML=thoughts[day];
function generateMotivation(){

    let mood=document.getElementById("mood").value;

    let message="";
    let challenge="";
    let tip="";

    if(mood=="stress"){

        message="Dear Student ❤️<br><br>Exam stress is normal. Every successful student has faced this stage. Don't worry about the whole syllabus. Complete one topic at a time. Believe in yourself. Your hard work will definitely pay off.";

        challenge="📚 Revise 1 Chapter + Solve 20 MCQs Today.";

        tip="💡 Focus on Revision, not on Fear.";

    }

    else if(mood=="demotivated"){

        message="Every topper has felt demotivated at some point. Success comes to those who keep moving forward. One small step today is enough. Never stop believing in yourself.";

        challenge="📖 Study for just 30 minutes without distractions.";

        tip="💡 Small daily progress creates big success.";

    }

    else if(mood=="lazy"){

        message="Don't wait for motivation. Start studying for only 10 minutes. Once you begin, your brain automatically gets into study mode.";

        challenge="⏰ Complete one topic before taking a break.";

        tip="💡 Action creates Motivation.";

    }

    else if(mood=="confidence"){

        message="Never compare yourself with others. Compare yourself with yesterday. You are improving every single day. Trust yourself.";

        challenge="✅ Solve one Mock Test today.";

        tip="💡 Confidence comes from Practice.";

    }

    else if(mood=="fear"){

        message="Failure is not the end. Every successful person failed before winning. Learn from mistakes and come back stronger.";

        challenge="🎯 Solve 15 difficult MCQs today.";

        tip="💡 Fear disappears when Preparation increases.";

    }

    else if(mood=="sad"){

        message="Bad days never last forever. Rest for a while, smile, and begin again. Your dream is still waiting for you.";

        challenge="😊 Read your favourite subject for 20 minutes.";

        tip="💡 Never lose hope.";

    }

    else if(mood=="happy"){

        message="Wonderful! Keep this positive energy. Continue studying with the same consistency and you will achieve your dream.";

        challenge="🚀 Help a friend in studies today.";

        tip="💡 Happiness grows when shared.";

    }

    else{

        message="Please select your mood first.";

        challenge="";

        tip="";

    }

    document.getElementById("result").innerHTML=`

<div id="aiResult" class="card shadow-lg border-0 mt-4" style="border-radius:20px;">

    <div class="card-header text-center bg-success text-white">

        <h2>🎉 Congratulations Student 🎉</h2>

        <p class="mb-0">
            🌟 Keep Believing In Yourself 🌟
        </p>

    </div>

    <div class="card-body p-4">

        <div class="text-center mb-4">

            <h1 style="font-size:70px;">🏆</h1>

            <h3 class="text-primary">

                AI Motivation

            </h3>

        </div>

        <div class="alert alert-primary">

            ${message}

        </div>

        <hr>

        <div class="alert alert-warning">

            <h4>⭐ Today's Challenge</h4>

            ${challenge}

        </div>

        <hr>

        <div class="alert alert-info">

            <h4>💡 Success Tip</h4>

            ${tip}

        </div>

        <hr>

        <div class="text-center">

            <h2>💪 Never Give Up 💪</h2>

            <h5 class="text-success">

                Every Small Step Takes You Closer To Success.

            </h5>

            <br>

            ⭐⭐⭐⭐⭐

        </div>

    </div>

</div>

`;
setTimeout(function(){

    document.getElementById("aiResult").scrollIntoView({

        behavior: "smooth",
        block: "start"

    });

},100);

}
</script>

{% endblock %}
